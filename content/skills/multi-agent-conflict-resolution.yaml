skill:
  id: skl-multi-agent-conflict-resolution
  name: Multi-Agent Conflict Resolution
  slug: multi-agent-conflict-resolution
  version: 1.0.0
  category: multi-agent-systems
  layer: L5
  domain: null
  description: Resolve contradictory outputs or competing actions between agents by rule rather than by whichever finished last.
  purpose: >-
    When agents disagree, most systems resolve it implicitly — the last write
    wins, or the loudest confidence score does. This skill establishes resolution
    rules before conflicts occur, distinguishes disagreement types, and preserves
    the losing position so that a wrong resolution is discoverable.
  trigger: >-
    Two or more agents produce contradictory conclusions, or attempt incompatible
    actions on the same resource.
  inputs:
    - name: conflicting_outputs
      required: true
      type: object[]
      description: The competing results with their producing agent, reasoning and confidence.
    - name: resolution_policy
      required: false
      type: string
      description: Pre-established rules for this conflict class, if any exist.
    - name: shared_context
      required: true
      type: string
      description: What all agents had access to, which reveals whether the conflict comes from differing inputs.
    - name: stakes
      required: true
      type: string
      description: What follows from choosing wrongly, which determines whether to resolve or escalate.
  prerequisites:
    - agent-role-design
  tools:
    - llm-inference
    - audit-log
    - policy-engine
    - human-review
  dependencies:
    - Agent outputs that include reasoning, not just conclusions
  procedure:
    - step: Classify the conflict
      description: >-
        Determine whether agents disagree on facts, on interpretation, on
        priorities, or are answering subtly different questions.
    - step: Check for input divergence
      description: >-
        Verify whether agents saw the same inputs. Most apparent disagreement is
        different evidence rather than different reasoning.
    - step: Compare reasoning, not confidence
      description: >-
        Evaluate the chain of reasoning behind each position. Confidence scores
        are not comparable across agents and reward assertiveness.
    - step: Apply the resolution policy
      description: >-
        Where a rule exists — authority order, recency, specificity, conservative
        default — apply it and record which rule applied.
    - step: Prefer the conservative position on safety
      description: >-
        Where the conflict affects safety, funds or irreversibility, resolve
        toward the more conservative position regardless of confidence.
    - step: Preserve the losing position
      description: >-
        Record the rejected result and the reason, so a wrong resolution can be
        found later.
    - step: Escalate genuine ties
      description: >-
        Where reasoning is equally sound and stakes are material, escalate rather
        than selecting arbitrarily.
    - step: Update the policy
      description: >-
        Feed recurring conflict classes back into the resolution policy so the
        same conflict is resolved by rule next time.
  decision_rules:
    - condition: Agents saw different inputs
      action: Reconcile the inputs first; this usually dissolves the conflict.
    - condition: The conflict affects an irreversible action
      action: Resolve conservatively or escalate; never resolve by confidence.
    - condition: One agent has domain authority for this class
      action: Prefer it and record the authority basis.
    - condition: Reasoning quality is genuinely equal and stakes are material
      action: Escalate to a human with both positions.
    - condition: The same conflict class recurs
      action: Add a resolution rule rather than adjudicating each instance.
  outputs:
    - name: resolution
      type: object
      description: The selected position with the rule or reasoning that selected it.
    - name: conflict_record
      type: json
      description: All positions including rejected ones, with reasons.
    - name: conflict_class
      type: string
      description: The type of disagreement, for policy improvement.
    - name: policy_update
      type: object
      description: Proposed rule to resolve this class automatically in future.
  validation:
    - check: Input divergence was checked before adjudicating reasoning.
    - check: Resolution is based on reasoning or an explicit rule, not on confidence scores.
    - check: The rejected position is preserved with its reasoning.
    - check: Safety-relevant conflicts resolved conservatively or escalated.
  failure_modes:
    - failure: The last agent to finish overwrites a better result.
      mitigation: Resolve by rule; never by write order.
    - failure: A confidently wrong agent wins over a correctly hedged one.
      mitigation: Compare reasoning, not stated confidence.
    - failure: The conflict is really an input difference and is adjudicated as a reasoning dispute.
      mitigation: Check shared context first.
    - failure: Rejected positions are discarded and a wrong resolution is undiscoverable.
      mitigation: Preserve all positions in the conflict record.
  escalation:
    - condition: Positions are equally supported and the stakes are material.
      action: Escalate to a human with both positions and the conflict class.
    - condition: The conflict reveals a role or ownership defect.
      action: Escalate to the system designer rather than resolving instance by instance.
  examples:
    - title: Two research agents disagree on a competitor's pricing
      input:
        stakes: Feeds a pricing decision
      output:
        conflict_class: Input divergence — one agent used a cached page from March
        resolution: Current pricing accepted; cache policy flagged
    - title: Implementation and verification agents disagree on completeness
      input:
        stakes: Merge decision
      output:
        resolution: Verifier's position accepted per authority rule
        policy_update: Verification authority is explicit for completeness claims
  related_skills:
    prerequisites: [agent-role-design]
    complementary: [task-decomposition-delegation, evidence-synthesis]
    successors: [agent-telemetry-instrumentation, failure-taxonomy]
    related: [source-credibility-assessment, memory-hygiene]
  complexity: advanced
  build_speed: 3
  shareability: 2
  maturity: prototype
  tags: [multi-agent, conflict, arbitration, policy, verification]
  author: Agent Skills Compendium
  license: MIT
  risk_level: medium
  required_permissions: [audit.write]
  restricted_actions: [Resolving safety-relevant conflicts by confidence score, Discarding rejected positions]
  created_at: "2025-03-30T00:00:00Z"
  updated_at: "2025-08-02T00:00:00Z"
