skill:
  id: skl-feature-implementation
  name: Feature Implementation
  slug: feature-implementation
  version: 1.3.0
  category: coding-engineering
  layer: L3
  domain: software-engineering
  description: Implement a specified change so that it fits the codebase, is verified before submission, and is reviewable as a single coherent diff.
  purpose: >-
    Working code is the floor, not the goal. This skill produces a change that a
    reviewer can evaluate quickly, that matches the codebase's own idiom, that is
    covered by tests which would fail without it, and whose scope has not drifted
    beyond what was asked.
  trigger: >-
    A specified change must be made to a codebase and verified.
  inputs:
    - name: specification
      required: true
      type: string
      description: What to build, including acceptance criteria.
    - name: codebase_model
      required: true
      type: string
      description: Output of codebase orientation — conventions, change surface, hazards, verification loop.
    - name: scope_boundary
      required: false
      type: string
      description: What is explicitly out of scope, to prevent opportunistic refactoring.
    - name: review_context
      required: false
      type: string
      description: Who reviews and what they care about, which shapes commit structure.
  prerequisites:
    - codebase-orientation
  tools:
    - code-editor
    - code-search
    - file-system
    - test-runner
    - build-system
    - version-control
    - shell
  dependencies:
    - A working local verification loop
    - Write access to a branch, never to the default branch
  procedure:
    - step: Restate the change and its boundary
      description: >-
        Write down what will change and what deliberately will not, before
        editing. Scope drift is the most common review failure.
    - step: Write the failing test first where practical
      description: >-
        Encode the acceptance criteria as a test that fails now, so the
        implementation has an objective target.
    - step: Implement in the codebase's idiom
      description: >-
        Match surrounding naming, error handling, logging and structure. A change
        that is correct but foreign costs the reviewer more than it saves.
    - step: Handle failure paths explicitly
      description: >-
        Implement timeout, partial failure and invalid input behaviour as
        specified, not as an afterthought.
    - step: Run the full verification loop
      description: >-
        Execute build, type check, lint and the relevant test suite. Report
        actual output rather than asserting success.
    - step: Review the diff as a reviewer would
      description: >-
        Read the complete diff for leftovers, debug output, unrelated changes and
        accidental reformatting.
    - step: Structure commits for review
      description: >-
        Separate mechanical changes from semantic ones so the reviewer can read
        the meaningful part quickly.
    - step: State what was not done
      description: >-
        Report deferred work, known limitations and anything the specification
        left open that was resolved by assumption.
  decision_rules:
    - condition: The specification is ambiguous on a decision that changes behaviour
      action: Implement the reading that is easiest to reverse, state the assumption, and flag it in the summary.
    - condition: A defect is found outside the change surface
      action: Report it separately; do not fix it in this diff.
    - condition: Tests fail after the change
      action: Report the failure with output; never claim completion with a failing suite.
    - condition: The change requires touching a hazard file
      action: Add coverage for the existing invariant before modifying it.
    - condition: The diff exceeds what one reviewer can hold in mind
      action: Split into sequential changes rather than submitting a single large diff.
  outputs:
    - name: code_changes
      type: diff
      description: The implemented change as a reviewable diff.
    - name: test_evidence
      type: string
      description: Actual output of the verification loop, including failures if any.
    - name: assumptions
      type: string[]
      description: Ambiguities resolved by assumption, with the reading chosen.
    - name: deferred_work
      type: string[]
      description: What was deliberately not done and why.
  validation:
    - check: The added tests fail without the change and pass with it.
    - check: The full verification loop was executed and its real output reported.
    - check: The diff contains no debug output, commented-out code or unrelated reformatting.
    - check: Every acceptance criterion in the specification is satisfied or explicitly deferred.
    - check: Changes stay within the stated scope boundary.
  failure_modes:
    - failure: Completion is reported while tests fail or were never run.
      mitigation: Require pasted verification output as an artifact, not a claim.
    - failure: Opportunistic refactoring makes the diff unreviewable.
      mitigation: Enforce the scope boundary and route unrelated fixes to separate changes.
    - failure: Tests are written to pass rather than to detect the defect.
      mitigation: Require the test to fail before the implementation exists.
    - failure: The change works but violates the codebase's conventions.
      mitigation: Drive style from the observed conventions in the codebase model.
    - failure: Failure paths are unimplemented and surface in production.
      mitigation: Treat failure-path implementation as a required step, not an option.
  escalation:
    - condition: The specification cannot be implemented without violating an existing invariant.
      action: Stop and escalate to the specification owner rather than weakening the invariant.
    - condition: The change requires a credential, migration or production action.
      action: Escalate for human execution; do not perform it autonomously.
    - condition: Implementation reveals the specification solves the wrong problem.
      action: Stop and escalate before completing the work.
  examples:
    - title: Adding idempotency to a webhook endpoint
      input:
        specification: Duplicate deliveries must produce one state transition
        scope_boundary: Do not change the partner contract or the retry policy
      output:
        test_evidence: 47 passed, 0 failed; new test fails on the pre-change commit
        assumptions: [Idempotency window set to 24 hours, matching partner retry ceiling]
        deferred_work: [Backfill of historical duplicates]
    - title: Adding a rate limit to an internal API
      input:
        specification: 100 requests per minute per client, 429 with Retry-After
      output:
        test_evidence: Build ok, 112 passed; contract test asserts Retry-After header
        deferred_work: [Distributed limiting across replicas — single-node only in this change]
  related_skills:
    prerequisites: [codebase-orientation]
    complementary: [test-suite-authoring, technical-specification]
    successors: [code-review, release-readiness-check]
    related: [dependency-upgrade, debug-root-cause-analysis]
  complexity: intermediate
  build_speed: 2
  shareability: 3
  maturity: production
  tags: [engineering, implementation, testing, diffs, verification]
  author: Agent Skills Compendium
  license: MIT
  risk_level: medium
  required_permissions: [repo.write, shell.execute]
  restricted_actions: [Committing to the default branch, Running migrations, Using production credentials]
  created_at: "2025-01-08T00:00:00Z"
  updated_at: "2025-08-30T00:00:00Z"
